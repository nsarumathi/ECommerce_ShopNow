apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopnow-frontend

  labels:
    app: shopnow-frontend

spec:

  replicas: 2

  selector:
    matchLabels:
      app: shopnow-frontend

  template:

    metadata:
      labels:
        app: shopnow-frontend

    spec:

      containers:

        - name: frontend

          image: 944765969321.dkr.ecr.ap-south-2.amazonaws.com/shopnow-frontend:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 30
            periodSeconds: 20

      imagePullSecrets: []